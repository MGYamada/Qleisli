name = "qleisli_qptl_application"
defaultTargets = ["RuntimeTapeDirectSum", "ProtectedClean", "ProtectedProgram",
  "StructuralComputedResources", "WorkspaceTargetAction", "RuntimeWorkspaceRestoration",
  "ControlledWorkspace", "ProtectedObserving"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "qleisli_proofs"
path = ".."

[[require]]
name = "qptl"
path = "../../qptl"

[[lean_lib]]
name = "RuntimeTapeDirectSum"

[[lean_lib]]
name = "ProtectedClean"

[[lean_lib]]
name = "ProtectedProgram"

[[lean_lib]]
name = "StructuralComputedResources"

[[lean_lib]]
name = "WorkspaceTargetAction"

[[lean_lib]]
name = "RuntimeWorkspaceRestoration"

[[lean_lib]]
name = "ControlledWorkspace"

[[lean_lib]]
name = "ProtectedObserving"
