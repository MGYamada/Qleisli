[package]
name = "qleisli"
version = "0.3.0-beta"
authors = ["Qleisli Project Contributors"]
license = "Apache-2.0"
repository = "https://github.com/MGYamada/Qleisli"
edition = "2024"
rust-version = "1.85"
description = "Experimental quantum language with linear ownership, exact contracts and independent finite IR verification"
readme = "README.crates.md"
documentation = "https://docs.rs/qleisli"
keywords = ["quantum", "compiler", "verification", "openqasm", "qir"]
categories = ["compilers", "science", "command-line-utilities"]
# Historical validation records remain in the complete GitHub source archive.
# Retain executable fixture sources, migration maps and frozen native inputs.
exclude = [
    "/assets/logo-concepts/**",
    "/experimental/**",
    "/tests/fixtures/**/*.gz",
    "/tests/fixtures/**/*.rs",
    "/tests/fixtures/**/*.lean",
    "/tests/fixtures/**/*.py",
    "/tests/fixtures/**/*.log",
    "/tests/fixtures/**/*.stderr",
    "/tests/fixtures/**/*.stdout",
    "/tests/fixtures/**/*.json",
    "!/tests/fixtures/**/*source-map.json",
    "!/tests/fixtures/verification_v022/hierarchy/**",
]

[lib]
name = "qleisli"
path = "src/lib.rs"

[dependencies]
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.3", features = ["fs", "system", "process"] }

[lints.rust]
unsafe_code = "forbid"
