name: Produce reviewable current proof records

on:
  push:
    branches: [codex/beta-finite-adts, codex/beta-ordinary-adts, codex/beta-typed-ordinary-runtime, codex/beta-qmatch, codex/beta-qmatch-arm-body, codex/beta-qmatch-three-calls, codex/beta-qmatch-op-slots, codex/beta-qmatch-duty-forest, codex/beta-qmatch-instrument-composition, codex/beta-qmatch-source-flow, codex/beta-qmatch-child-runs, codex/beta-qmatch-primitive-code-flow, codex/beta-qmatch-output-codes, codex/beta-qmatch-caller-action, codex/beta-qmatch-selection-flow, codex/beta-qmatch-selection-input-action, codex/beta-qmatch-composed-body, codex/beta-qmatch-packed-output, codex/beta-qmatch-adjacent-observing, codex/beta-qmatch-finite-rows, codex/beta-qmatch-ordinary-phis, codex/beta-qmatch-history-ids, codex/beta-qmatch-measurement-values, codex/beta-qmatch-arm-refinement, codex/beta-qmatch-branch-refinement, codex/beta-qmatch-structural-refinement, codex/beta-qmatch-sparse-history, codex/beta-qmatch-selection-recursion, codex/beta-qmatch-general-calls, codex/beta-qmatch-source-call-return, codex/beta-qmatch-selection-proofs, codex/beta-qmatch-basis-events, codex/beta-qmatch-sparse-gram, codex/beta-qmatch-code-products, codex/beta-qmatch-batch-integration, codex/beta-qmatch-bounded-v5, codex/beta-qmatch-gram-routing, codex/beta-qmatch-forward-tape, codex/beta-quantum-runtime-types, codex/beta-runtime-static-bindings, codex/beta-64-nominal-body-provenance, codex/beta-64-nominal-basis, codex/beta-64-standalone-basis, codex/beta-64-standalone-meaning, codex/beta-64-nominal-meaning-ports, codex/beta-64-nominal-meaning-composition, codex/beta-64-rectangular-nominal-meaning, codex/beta-64-declared-meaning, codex/beta-64-computed-predicate]
    paths:
      - .github/workflows/current-proof-records.yml
      - scripts/refresh_current_proof_records.py
      - scripts/check_schema_registry.py
      - lean/**
      - lean-kernel/**
      - src/**
      - scripts/current_metadata.py
      - scripts/check_verification_inventory.py
      - scripts/check_production_coverage.py
      - tests/fixtures/verification_v022/inventory.json.xz
      - tests/fixtures/verification_v029/coverage.json.xz
  workflow_dispatch:

# This bootstrap artifact producer is intentionally independent of changes and
# stale source-integrity checks. It is not an ordinary CI or release receipt.
permissions:
  contents: read

concurrency:
  group: current-proof-records-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  produce-review-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clean head and cumulative size budgets before builds
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          python3 scripts/check_pr_size.py --report "$RUNNER_TEMP/proof-size.json"
          python3 scripts/check_fixture_budget.py --hosted --report "$RUNNER_TEMP/proof-fixtures.json"
          python3 scripts/check_fixture_references.py --hosted
          python3 -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import refresh_current_proof_records as maintenance
          maintenance.hosted_context(os.environ['SOURCE_COMMIT'], os.environ)
          report = maintenance.cumulative(os.environ['SOURCE_COMMIT'])
          (Path(os.environ['RUNNER_TEMP']) / 'proof-cumulative.json').write_bytes(maintenance.encoded(report))
          PY
          python3 -B scripts/test_refresh_current_proof_records.py
      - name: Determine whether current proof records need regeneration
        id: records
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          checks = []
          for command in (["python3", "scripts/check_schema_registry.py", "--source-only"],
                          ["python3", "scripts/check_initial_guarantees.py"]):
              started = time.monotonic()
              result = subprocess.run(command, capture_output=True, text=True)
              checks.append(dict(command=command, exit_code=result.returncode,
                                 seconds=time.monotonic()-started,
                                 stdout=result.stdout, stderr=result.stderr))
          refresh = os.environ["GITHUB_EVENT_NAME"] != "push" or any(row["exit_code"] for row in checks)
          report = dict(source_commit=os.environ["SOURCE_COMMIT"], refresh=bool(refresh),
                        scope="current source-record identities", checks=checks)
          (Path(os.environ["RUNNER_TEMP"]) / "proof-record-freshness.json").write_text(json.dumps(report, indent=2)+"\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("refresh="+str(bool(refresh)).lower()+"\n")
          print(json.dumps(report))
          PY
      - name: Install the pinned native toolchain without a duplicate build
        if: steps.records.outputs.refresh == 'true'
        uses: ./.github/actions/native-runtime
        with:
          prepare: 'false'
      - name: Prepare the pinned mathematical package and its existing cache
        if: steps.records.outputs.refresh == 'true'
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          use-github-cache: 'false'
          build: 'false'
      - name: Compile the native package in the fresh checkout
        if: steps.records.outputs.refresh == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          python3 scripts/check_lean_kernel.py
          echo "$SOURCE_COMMIT" > "$RUNNER_TEMP/proof-native-build.log"
          (cd lean-kernel && lake build) 2>&1 | tee -a "$RUNNER_TEMP/proof-native-build.log"
      - name: Execute the fixed fresh proof and review-output plan
        if: steps.records.outputs.refresh == 'true'
        run: python3 -B scripts/refresh_current_proof_records.py --source-commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/current-proof-records"
      - name: Retain actual proof records and proposed metadata for human review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-proof-records-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof-record-freshness.json
            ${{ runner.temp }}/proof-size.json
            ${{ runner.temp }}/proof-fixtures.json
            ${{ runner.temp }}/proof-cumulative.json
            ${{ runner.temp }}/proof-native-build.log
            ${{ runner.temp }}/current-proof-records/
          if-no-files-found: error
