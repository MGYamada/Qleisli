name: Specification and implementation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.1 fmt --check
      - run: cargo +1.98.1 test --all-targets
      - name: Sized Rust and Python source dialect comparisons on small inputs
        run: cargo +1.98.1 test --test sized_review_dialects -- --ignored --skip native
      - name: Sized primitive omissions must fail compilation
        run: python3 scripts/test_sized_primitive_catalog.py
      - name: Build public API documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.1 doc --no-deps
      - name: Execute public API documentation examples
        run: cargo +1.98.1 test --doc
      - run: target/debug/qleisli check tests/fixtures/lean_layout/first_source
      - run: target/debug/qleisli check tests/fixtures/lean_layout_dag/first_source
      - run: target/debug/qleisli check tests/fixtures/lean_phase_layout/first_source
      - run: python3 scripts/test_lean_phase_layout.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_interference.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_qft.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_qpe.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_controlled_power.py --source-only target/debug/qleisli
      - run: python3 scripts/test_cli_json.py target/debug/qleisli
      - name: Seeded source differential checks with an independent complex oracle
        run: |
          python3 scripts/test_test_qli_differential.py
          python3 scripts/test_qli_differential.py target/debug/qleisli --cases=96
      - name: Frozen VM-22 finite/source comparison inputs
        run: python3 scripts/test_verification_baseline.py target/debug/qleisli
      - run: python3 scripts/check_input_corpus.py target/debug/qleisli --exhaustive
      - run: cargo +1.98.1 clippy --all-targets -- -D warnings
      - run: cargo +1.98.1 fmt --manifest-path research/semantic-kernel/Cargo.toml --check
      - run: cargo +1.98.1 test --manifest-path research/semantic-kernel/Cargo.toml --all-targets
      - run: cargo +1.98.1 clippy --manifest-path research/semantic-kernel/Cargo.toml --all-targets -- -D warnings

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy
      - run: cargo +1.85.0 test --all-targets
      - run: target/debug/qleisli check tests/fixtures/lean_layout/first_source
      - run: target/debug/qleisli check tests/fixtures/lean_layout_dag/first_source
      - run: target/debug/qleisli check tests/fixtures/lean_phase_layout/first_source
      - run: python3 scripts/test_lean_phase_layout.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_interference.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_qft.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_qpe.py --source-only target/debug/qleisli
      - run: python3 scripts/test_lean_controlled_power.py --source-only target/debug/qleisli
      - run: python3 scripts/test_cli_json.py target/debug/qleisli
      - run: cargo +1.85.0 clippy --all-targets -- -D warnings
      - run: cargo +1.85.0 test --manifest-path research/semantic-kernel/Cargo.toml --all-targets
      - run: cargo +1.85.0 clippy --manifest-path research/semantic-kernel/Cargo.toml --all-targets -- -D warnings

  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validators and the tested Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y llvm-18 python3-venv
          python3 -m venv /tmp/qleisli-interop-validation
          /tmp/qleisli-interop-validation/bin/pip install -r scripts/interop-validation-requirements.txt
          /tmp/qleisli-interop-validation/bin/pip install -r scripts/qir-reader-requirements.txt
          /tmp/qleisli-interop-validation/bin/pip install setuptools==80.9.0
          /tmp/qleisli-interop-validation/bin/pip install --no-build-isolation --no-deps ./python
      - run: cargo +1.98.1 build --example interop --bin qleisli
      - name: Independently parse OpenQASM and verify QIR with LLVM
        run: /tmp/qleisli-interop-validation/bin/python scripts/test_interop_external.py target/debug/examples/interop --llvm-as llvm-as-18 --opt opt-18
      - name: Installed Python API and independently authored QIR input
        run: |
          /tmp/qleisli-interop-validation/bin/python scripts/test_connections.py
          llvm-as-18 tests/fixtures/interop/independent.ll -o /tmp/qleisli-independent.bc
          opt-18 -passes=verify -disable-output /tmp/qleisli-independent.bc

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
      - name: Audit every project declaration for forbidden axioms
        working-directory: lean
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Bind shipped schema types to rebuilt declarations and audited executable sources
        run: python3 scripts/check_schema_registry.py
  lean-kernel:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the tested Rust toolchain for native host comparisons
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch Rust dependencies before offline native host comparisons
        run: cargo +1.98.1 fetch
      - name: Reject kernel/backend source escape hatches and unaudited imports
        run: python3 scripts/check_lean_kernel.py
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean-kernel
          auto-config: 'false'
          build: 'true'
          use-mathlib-cache: 'false'
      - name: Audit axioms, unsafe/partial declarations and runtime replacements
        working-directory: lean-kernel
        run: |
          lake env lean -DwarningAsError=true Audit.lean
          lake env lean -DwarningAsError=true Tests.lean
      - name: Replay the compiled project definitions through Lean's kernel
        working-directory: lean-kernel
        run: |
          lake env leanchecker --fresh QleisliKernel
          lake env leanchecker --fresh Main
      - name: Reject backend unsafe, implemented_by, extern and partial counterexamples
        run: python3 scripts/test_check_lean_kernel.py --compiled
      - name: Shared DAG semantics, binding, limits and zero-width owners
        run: python3 scripts/test_lean_hierarchy.py
      - name: Typed owner and axis permutations with independent requests
        run: python3 scripts/test_lean_layout.py
      - name: Shared typed calls, ordered composition and independent graph oracle
        run: python3 scripts/test_lean_layout_dag.py
      - name: Typed dyadic phases, controlled conditions and layout composition
        run: python3 scripts/test_lean_phase_layout.py
      - name: Sparse phase powers and coherent controls match independent integer oracles
        run: python3 scripts/test_lean_phase_operations.py
      - name: Actual shared-gradient binding, phase semantics and remaining budgets
        run: python3 scripts/test_hierarchical_gradient.py
      - name: Actual Fourier-stage geometry, complex coefficients and shared budgets
        run: python3 scripts/test_hierarchical_fourier_stage.py
      - name: Native interference normalization and independent joint amplitudes
        run: python3 scripts/test_lean_interference.py
      - name: VM-23 native exact arithmetic, Rust capacities and independent rational matrices
        run: python3 scripts/test_lean_exact.py
      - name: VM-24 native finite circuits, fresh encoded equations and original serialized matrices
        run: python3 scripts/test_lean_finite.py
      - name: Symbolic QFT paths and independent Fourier coefficients
        run: python3 scripts/test_lean_qft.py
      - name: Small QFT semantic-path matcher and nonliteral candidates
        run: python3 scripts/test_lean_qft.py --small --semantic
      - name: Typed QFT graph binding and independent paths
        run: python3 scripts/test_lean_qft_graph.py
      - name: QPE plans and independent residual instruments
        run: python3 scripts/test_lean_qpe.py
      - name: Coherent controlled powers and exact joint-reference matrices
        run: python3 scripts/test_lean_controlled_power.py
      - name: Full-profile graph schedules, cycles and aggregate capacities
        run: python3 scripts/test_hierarchical_graph.py
      - name: Typed artifact dependencies, endpoints and shared work budget
        run: python3 scripts/test_hierarchical_artifact.py
      - name: Actual node ownership, effects, call names and zero-repeat bodies
        run: python3 scripts/test_hierarchical_typing.py
      - name: Meaning and encoding types, QPE providers and zero-scratch shapes
        run: python3 scripts/test_hierarchical_contract_typing.py
      - name: Check explicit structural conversions
        run: python3 scripts/test_hierarchical_structural.py
      - name: Canonical reshape metadata and independent tree encoding
        run: python3 scripts/test_lean_reshape.py
      - name: Actual readout nodes, classical assembly and residual/reference branches
        run: python3 scripts/test_hierarchical_readout.py
      - name: Actual fresh-zero nodes and retained reference coefficients
        run: python3 scripts/test_hierarchical_preparation.py
      - name: Composed instrument boundaries and retained finite obligations
        run: python3 scripts/test_hierarchical_instrument.py
      - name: Composed instrument transport, finite discharge and small source clients
        run: python3 scripts/test_instrument_host.py
      - name: Checked hierarchy execution and full complex measurement branches
        run: python3 scripts/test_hierarchical_execution.py
      - name: Source graph compaction preserves phase, sharing and empty owners
        run: python3 scripts/test_compact_sized_graph.py
      - name: Ordinary measured QPE and classical-result clients on small systems
        run: python3 scripts/test_sized_instrument.py
      - name: Shared QPE source through structural readout on small systems
        run: python3 scripts/test_sized_qpe_readout.py
      - name: Bind controlled powers to actual bodies and provider obligations
        run: python3 scripts/test_hierarchical_power.py
      - name: Actual source controlled powers through checked owner renames
        run: python3 scripts/test_hierarchical_routed_power.py
      - name: Actual shared circuit routes and ordered phase-sensitive atom traces
        run: python3 scripts/test_hierarchical_circuit_trace.py
      - name: Check actual QPE schedule components
        run: python3 scripts/test_hierarchical_qpe_schedule.py
      - name: Check QPE root and provider binding
        run: python3 scripts/test_hierarchical_qpe_root.py
      - name: Check actual QPE initialization and ordered readout
        run: python3 scripts/test_hierarchical_qpe_instrument.py
      - name: Native checking of Rust sized-source proposals
        run: QLEISLI_HIERARCHY_KERNEL=lean-kernel/.lake/build/bin/qleisli-kernel cargo +1.98.1 test --test sized_source -- --ignored
      - name: Rust GHZ and arithmetic corpus with independent small-system oracles
        run: QLEISLI_HIERARCHY_KERNEL=lean-kernel/.lake/build/bin/qleisli-kernel cargo +1.98.1 test --test sized_review_dialects native -- --ignored
      - name: Sized-source CLI checking, execution and sampling
        run: QLEISLI_HIERARCHY_KERNEL=lean-kernel/.lake/build/bin/qleisli-kernel cargo +1.98.1 test --test sized_cli -- --ignored
      - name: Rust source to named QPE with independent phase and reference probes
        run: QLEISLI_HIERARCHY_KERNEL=lean-kernel/.lake/build/bin/qleisli-kernel cargo +1.98.1 test --lib native_named_qpe -- --ignored
      - name: Check actual provider derivations from an empty proof cache
        run: python3 scripts/test_hierarchical_derivation.py
      - name: Shared call expansion, typed adapters and independent phase oracle
        run: python3 scripts/test_hierarchical_calls.py
      - name: Finite requests retain actual bytes, types, ports and endpoint indices
        run: python3 scripts/test_hierarchical_finite.py
      - name: Conditional derivations retain every shared finite obligation
        run: python3 scripts/test_hierarchical_conditional.py
      - name: Independently requested hierarchy roots and untrusted pair proposals
        run: python3 scripts/test_hierarchical_request.py
      - name: Fresh hierarchy transport and finite reconstruction
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_hierarchical_host.py
      - name: Frozen VM-22 comparisons with the experimental native word component
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          cargo build --bin qleisli
          python3 scripts/test_verification_baseline.py target/debug/qleisli --kernel lean-kernel/.lake/build/bin/qleisli-kernel
      - name: One-bit Fourier bases and fresh phase-fixed H reconstruction
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_hierarchical_fourier_base.py
      - name: Complete recursive Fourier bodies and bound H obligations
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_hierarchical_fourier_body.py
      - name: Actual shared wiring, outer QFT permutations and aggregate budgets
        run: python3 scripts/test_hierarchical_wiring.py
      - name: Actual outer Fourier requests and bound phase-fixed H obligations
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_hierarchical_fourier_root.py
      - name: Complete Fourier requests through fresh native and exact host checks
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_hierarchical_fourier_host.py
      - name: Sized Xor and GHZ source corpus with independent native and semantic checks
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_sized_corpus.py --small
      - name: Shared QFT source, named Fourier contracts, inverse and shared calls
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_sized_qft.py --small
      - name: Rust source Fourier factoring with exact traces and fresh native checks
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_rust_fourier_factoring.py
      - name: Small-system coherent QPE source and phase/reference diagnostics
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_sized_qpe.py
      - name: Small-system shared AddK and Equals sources, restoration and phase checks
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_sized_arithmetic.py
      - name: Shared QPE order and amplitude clients with operation forwarding
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_sized_qpe_clients.py
      - name: QFT hierarchy widths one through four and retained width-eight capacity case
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_hierarchical_qft.py
      - name: Shared-gradient QFT hierarchies at every supported width
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/test_hierarchical_qft.py --construction shared-gradient
      - name: Differential and process-boundary checks
        run: cargo +1.98.1 run --example lean_kernel -- lean-kernel/.lake/build/bin/qleisli-kernel --self-test
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Fetch package dependencies before offline distribution checks
        run: cargo +1.98.1 fetch
      - name: Verify clean package and complete source archive
        run: python3 scripts/check_distribution.py --report "$RUNNER_TEMP/qleisli-distribution.json" --target-dir "$RUNNER_TEMP/qleisli-distribution-target"
      - name: Retain candidate hashes, archives and command logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qleisli-distribution.json
            ${{ runner.temp }}/qleisli-distribution-artifacts-*/logs/
            ${{ runner.temp }}/qleisli-distribution-artifacts-*/*.crate
            ${{ runner.temp }}/qleisli-distribution-artifacts-*/*-source.tar
          if-no-files-found: error
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check edition 2026 coverage of every Qleisli source and QLT draft
        run: |
          python3 scripts/test_check_editions.py
          python3 scripts/check_editions.py
      - run: python3 scripts/test_check_docs.py
      - run: python3 scripts/test_check_lean_kernel.py
      - run: python3 scripts/test_check_schema_registry.py
      - run: python3 scripts/check_schema_registry.py --source-only
      - run: python3 scripts/check_docs.py
      - name: Verification inventory coverage and independent oracle calibration
        run: |
          python3 scripts/test_check_verification_inventory.py
          python3 scripts/check_verification_inventory.py
          python3 scripts/test_test_verification_baseline.py
      - name: Standard-library contract-writing conventions and mutation checks
        run: |
          python3 scripts/test_check_stdlib_contract_docs.py
          python3 scripts/check_stdlib_contract_docs.py
      - run: python3 scripts/test_check_authoring_sessions.py
      - run: python3 scripts/check_authoring_sessions.py
      - run: python3 scripts/test_check_input_corpus.py
      - run: python3 scripts/check_input_corpus.py
      - run: python3 scripts/test_check_distribution.py
      - run: python3 scripts/test_check_imaginary_v1_examples.py
      - run: python3 scripts/check_imaginary_v1_examples.py
      - run: python3 scripts/test_check_semantic_contract_examples.py
      - run: python3 scripts/check_semantic_contract_examples.py
      - name: Check whitespace throughout the committed tree
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
