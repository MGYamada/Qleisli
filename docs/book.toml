[book]
title = "Qleisli Programming Language"
authors = ["Qleisli Project Contributors"]
description = "A guide to structured quantum programming in Qleisli."
language = "en"
src = "src"

[build]
build-dir = "../target/mdbook"
create-missing = false

[output.html]
site-url = "/Qleisli/"
git-repository-url = "https://github.com/MGYamada/Qleisli"
input-404 = "404.md"
mathjax-support = true

[output.html.playground]
runnable = false
