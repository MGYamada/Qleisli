name: QPTL

on:
  pull_request:
    paths:
      - 'qptl/**'
      - '.github/workflows/qptl.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'qptl/**'
      - '.github/workflows/qptl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: qptl
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Build QPTL and check its proofs
        working-directory: qptl
        run: |
          lake exe cache get Mathlib.CategoryTheory.CommSq Mathlib.CategoryTheory.Monoidal.Category \
            Mathlib.CategoryTheory.Preadditive.Mat Mathlib.Data.Complex.Basic Mathlib.Data.Matrix.Block \
            Mathlib.Tactic.NormNum Mathlib.Algebra.Order.BigOperators.Group.Finset \
            Mathlib.Analysis.Complex.Basic Mathlib.Data.Complex.BigOperators \
            Mathlib.LinearAlgebra.Matrix.PosDef
          lake build
          lake test
